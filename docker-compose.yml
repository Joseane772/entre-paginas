services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: entrepaginas
      POSTGRES_PASSWORD: entrepaginas
      POSTGRES_DB: entrepaginas
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U entrepaginas"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
